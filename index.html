<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <script>
      // Clear legacy service worker registrations & stale caches immediately
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          for (var r of registrations) {
            r.unregister();
          }
        }).catch(function () {});
      }
      if ('caches' in window) {
        caches.keys().then(function (names) {
          for (var name of names) {
            caches.delete(name);
          }
        }).catch(function () {});
      }
      window.addEventListener(
        'unhandledrejection',
        function (e) {
          var msg = e && e.reason ? String(e.reason.message || e.reason) : '';
          if (msg.indexOf('WebSocket closed without opened') !== -1 || msg.indexOf('@vite/client') !== -1) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        },
        true
      );
      window.addEventListener(
        'error',
        function (e) {
          var msg = e ? String(e.message || (e.error && e.error.message) || '') : '';
          if (msg.indexOf('WebSocket closed without opened') !== -1) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        },
        true
      );
    </script>
    <title>Srinath Photography — The Vintage Romance</title>
